name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  build-test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal scripts 2>/dev/null || true)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Product binary smoke
        run: |
          go build -trimpath -o zeokeel ./cmd/zeokeel
          ./zeokeel --version
          ./zeokeel --list-products

      - name: Cross-compile release targets
        run: |
          # Every release target must at least compile in CI, including the
          # Windows desktop/headless binaries.
          for target in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            binary="zeokeel"
            if [ "$goos" = "windows" ]; then
              binary="zeokeel.exe"
            fi
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0               go build -trimpath -o "/tmp/zeokeel-${goos}-${goarch}-${binary}" ./cmd/zeokeel
          done

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The race detector needs cgo; the workflow-wide default is CGO_ENABLED=0
    # so build/test jobs run without platform C dependencies.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with -race
        run: go test ./... -race -count=1
