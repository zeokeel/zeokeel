name: ci

# One definition of green, shared with the local gate (`scripts/ci.sh`) so a
# developer can reproduce exactly what CI runs. The heavy `-race ./internal/shell`
# suite is a separate job with an explicit 20m timeout (it takes ~9 minutes;
# AR-02/AR-17 in docs/BUGS.md).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (gofmt/vet/build/test/nocgo/coverage/race)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run scripts/ci.sh
        run: sh scripts/ci.sh
      - name: coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .cache/coverage.out
          if-no-files-found: warn
      - name: logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            /tmp/zk-nocgo.log
            /tmp/zk-race.log
          if-no-files-found: ignore

  race-shell:
    name: race (internal/shell, 20m timeout)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race ./internal/shell
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 20m ./internal/shell
