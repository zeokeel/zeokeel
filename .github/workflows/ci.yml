name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  # No module mirror override: the hosted runners reach proxy.golang.org, so the
  # job uses Go's defaults instead of a third-party mirror.

jobs:
  build-test:
    name: Build, vet, test
    # Pin the LTS image: ubuntu-latest migrates to Ubuntu 26 in October
    # 2026 (GitHub notice), and this product pins its toolchain and
    # snapshot baselines, so an unannounced runner upgrade would make CI
    # flaky. Bump this deliberately when the new image has been tested.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The web client is gitignored, so the embed directory only carries `.keep`
      # in a fresh checkout. Build it before anything compiles: `go build` would
      # otherwise succeed and every later assertion (smoke, packaging) would be
      # exercising a binary with no client inside.
      - uses: ./.github/actions/web-client

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal scripts 2>/dev/null || true)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./internal/... ./cmd/...

      - name: Vet
        run: go vet ./internal/... ./cmd/...

      - name: Protocol/implementation consistency
        # docs/TRANSPORT.md §5.1 (the method table) and the gateway's dispatch
        # table must list the same methods; the design-contract lint that used to
        # live here retired with the native UI (S7).
        run: go test ./internal/gateway -count=1 -run 'TestTransport' -v

      - name: Import boundaries
        # The module-boundary allowlist (AGENTS.md §1 / docs/ARCHITECTURE.md §3)
        # is machine-asserted in two tiers: the native engine is quarantined to
        # the shell + asset layers, the backend is transitively engine-free, and
        # host never reaches internal/modules directly (AR-22).
        run: go test ./internal/assembly -run TestImportBoundaries -count=1

      - name: Test
        # The hosted 2-vCPU runner was repeatedly shut down while several UI
        # test binaries rendered frames in parallel (exit 143 / "runner received
        # a shutdown signal", not a test assertion). Serialize package tests and
        # cap the heap so a burst cannot take the runner down; the suite is fast
        # enough (< 2 min on this runner) that -p=1 stays comfortably inside the
        # job timeout.
        env:
          GOFLAGS: -mod=mod -p=1
          GOMEMLIMIT: 4GiB
        run: go test ./internal/... ./cmd/... -count=1 -timeout 20m

      - name: Race detector (targeted)
        # 2026-11 audit AR-11: CI never ran -race. The concurrency-heavy
        # surfaces (UI frame loops, agent/toolkit lifecycles, host teardown)
        # get a dedicated race pass, serialized with the same -p=1 discipline
        # as the Test step. -race needs cgo, overriding the job-wide
        # CGO_ENABLED=0 (the ubuntu-24.04 image ships gcc).
        env:
          CGO_ENABLED: "1"
          GOFLAGS: -mod=mod -p=1
          GOMEMLIMIT: 4GiB
        run: go test -race ./internal/gateway ./internal/contracts ./internal/modules/... ./internal/host ./internal/assembly -count=1 -timeout 20m

      - name: Product binary smoke
        run: |
          go build -trimpath -o zeokeel ./cmd/zeokeel
          ./zeokeel --version
          ./zeokeel --list-products

      - name: Cross-compile release targets
        run: |
          # Every release target must at least compile in CI, including the
          # Windows desktop/headless binaries.
          for target in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            binary="zeokeel"
            if [ "$goos" = "windows" ]; then
              binary="zeokeel.exe"
            fi
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0               go build -trimpath -o "/tmp/zeokeel-${goos}-${goarch}-${binary}" ./cmd/zeokeel
          done

      - name: Package the Linux and Windows installers
        run: |
          # The release pipeline's inputs must exist: the GUI-subsystem Windows
          # executable with its NSIS installer, and the Linux application
          # directory. macOS packaging (dmg, signing, notarization) needs macOS
          # and is exercised by release.yml.
          sudo apt-get update
          sudo apt-get install -y nsis librsvg2-bin
          bash scripts/build-app.sh -platform "linux/amd64,windows/amd64" -skip-dmg -skip-notarize
          test -x build/linux-amd64/zeokeel
          test -n "$(find build/windows-amd64 -maxdepth 1 -name 'zeokeel-setup-*.exe' -print -quit)"
          file build/windows-amd64/ZeoKeel.exe | grep -q 'GUI'
