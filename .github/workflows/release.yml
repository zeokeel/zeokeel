name: Release

# Every vX.Y.Z tag publishes one GitHub release, built by mygo on the runner
# of each platform: Windows installers (NSIS, GUI subsystem), Linux AppImages
# and a signed + notarized macOS arm64 DMG. The release is created as a
# draft, every platform uploads into it, the central checksums step writes
# SHA256SUMS.txt and the last step publishes it. In-app updates read this
# release directly (no update-signing key): the update module picks the
# platform installer (Windows setup exe / macOS dmg / Linux AppImage) the
# release carries, and the host runs it in-app.
#
# Required repository secrets (set once by the maintainer):
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD  Developer ID Application .p12 + password
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER
#                                        App Store Connect API key for notarytool
# No secret value is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  # Domestic module mirror (also used by the Go checksum DB).
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: sum.golang.org

jobs:
  version-check:
    name: Check the tag matches VERSION
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          set -eu
          test -n "${GITHUB_REF_NAME:-}"
          version="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          }

  draft-release:
    name: Create the draft release
    needs: version-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "ZeoKeel $GITHUB_REF_NAME" --generate-notes
          fi

  build-macos:
    name: macOS arm64 (.app + signed/notarized dmg)
    needs: draft-release
    # Use the latest macOS arm64 image only (no Intel build): signing and
    # notarization run natively for the shipped arm64 app. Hosted arm64 capacity
    # can be slow; a failed acquisition is retried rather than switching arch.
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install librsvg (icon derivation)
        run: command -v rsvg-convert >/dev/null || brew install librsvg

      - name: Import the Developer ID certificate and the notary API key
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/zeokeel-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials zeokeel-notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          # mygo builds its notarize call with the keychain the config names.
          jq --arg kc "$keychain" '.macos.notarize.keychain = $kc' mygo.json > mygo.tmp
          mv mygo.tmp mygo.json
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and verify
        run: |
          set -eu
          bash scripts/build-app.sh -platform darwin/arm64
          app="build/darwin-arm64/ZeoKeel.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
          dmg="$(find build/darwin-arm64 -maxdepth 1 -name '*.dmg' | head -1)"
          test -n "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          # The in-app updater mounts this dmg and replaces the app bundle; no
          # tar.gz archive is published.
          ls -l "$dmg"

      - name: Upload the macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            build/darwin-arm64/*.dmg

      - name: Clean up the signing keychain
        if: always()
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

  build-windows:
    name: Windows installers (NSIS, GUI subsystem)
    needs: draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS and librsvg
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis librsvg2-bin

      - name: Build the installers
        run: |
          set -eu
          bash scripts/build-app.sh -platform windows/amd64,windows/arm64
          version="$(cat VERSION)"
          for arch in amd64 arm64; do
            test -f "build/windows-$arch/zeokeel-setup-$version-$arch.exe"
          done
          ls -l build/windows-amd64/zeokeel-setup-*.exe build/windows-arm64/zeokeel-setup-*.exe

      - name: Upload the Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The in-app updater runs these setup installers; no portable tar.gz
          # archive can reliably replace a per-user installed Windows app.
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            build/windows-amd64/zeokeel-setup-*.exe \
            build/windows-arm64/zeokeel-setup-*.exe

  build-linux:
    name: Linux AppImages
    needs: draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the AppImage toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin squashfs-tools patchelf desktop-file-utils file
          bin="$RUNNER_TEMP/appimage-bin"
          mkdir -p "$bin"
          for attempt in 1 2 3; do
            if GOBIN="$bin" GOPROXY=https://proxy.golang.org,direct GOSUMDB=sum.golang.org \
              go install github.com/probonopd/go-appimage/src/appimagetool@v0.0.0-20260903171257-b7864b5e53d4; then
              break
            fi
            echo "appimagetool install attempt $attempt failed; retrying" >&2
            sleep 10
          done
          printf '#!/bin/sh\nexit 0\n' > "$bin/uploadtool"
          chmod +x "$bin/uploadtool"
          for arch in x86_64 aarch64; do
            curl -fsSL --retry 5 --retry-delay 3 -o "$bin/runtime-$arch" \
              "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$arch"
            chmod +x "$bin/runtime-$arch"
          done
          echo "APPIMAGE_BIN=$bin" >> "$GITHUB_ENV"

      - name: Build the AppImages
        run: |
          set -eu
          bash scripts/build-app.sh -platform linux/amd64,linux/arm64
          APPIMAGETOOL="$APPIMAGE_BIN/appimagetool" \
            APPIMAGE_RUNTIME="$APPIMAGE_BIN/runtime-x86_64" \
            bash scripts/build-appimage.sh build/linux-amd64 "$(cat VERSION)" amd64
          APPIMAGETOOL="$APPIMAGE_BIN/appimagetool" \
            APPIMAGE_RUNTIME="$APPIMAGE_BIN/runtime-aarch64" \
            bash scripts/build-appimage.sh build/linux-arm64 "$(cat VERSION)" arm64
          ls -l build/zeokeel-*-linux-*.AppImage

      - name: Upload the Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            build/zeokeel-*-linux-amd64.AppImage \
            build/zeokeel-*-linux-arm64.AppImage

  publish:
    name: Checksums and publish
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the published assets, checksum them, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets --clobber --pattern '*'
          rm -f release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
