name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          commit="${GITHUB_SHA::12}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="zeokeel_${VERSION}_${goos}_${goarch}"
            mkdir -p "$name"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w \
                -X github.com/zeokeel/zeokeel/internal/host.Version=v${VERSION} \
                -X github.com/zeokeel/zeokeel/internal/host.Commit=${commit} \
                -X github.com/zeokeel/zeokeel/internal/host.BuildTime=${build_time}" \
              -o "${name}/zeokeel" ./cmd/zeokeel
            cp README.md LICENSE CHANGELOG.md "$name/"
            tar -czf "dist/${name}.tar.gz" "$name"
            rm -rf "$name"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)

      - name: Verify Linux binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tmp="$(mktemp -d)"
          tar -xzf "dist/zeokeel_${VERSION}_linux_amd64.tar.gz" -C "$tmp"
          "$tmp/zeokeel_${VERSION}_linux_amd64/zeokeel" --version | tee /tmp/version.txt
          grep -q "v${VERSION}" /tmp/version.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ZeoKeel v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
