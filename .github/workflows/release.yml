name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  # Domestic module mirror (also used by the Go checksum DB).
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: sum.golang.org

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          commit="${GITHUB_SHA::12}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          # Every supported OS/arch pair gets an explicit archive. Windows
          # binaries are .zip (and carry the .exe suffix); everything else is
          # .tar.gz. Names always include OS and architecture so the download
          # list on the release page is unambiguous.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="zeokeel_${VERSION}_${goos}_${goarch}"
            mkdir -p "$name"
            binary="zeokeel"
            if [ "$goos" = "windows" ]; then
              binary="zeokeel.exe"
            fi
            # CGO is disabled for every target (the product is pure Go), the
            # binary is stripped and VCS/build-id metadata is omitted, and the
            # archive itself is gzip/zip compressed.
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid= \
                -X github.com/zeokeel/zeokeel/internal/host.Version=v${VERSION} \
                -X github.com/zeokeel/zeokeel/internal/host.Commit=${commit} \
                -X github.com/zeokeel/zeokeel/internal/host.BuildTime=${build_time}" \
              -o "${name}/${binary}" ./cmd/zeokeel
            cp README.md LICENSE CHANGELOG.md VERSION "$name/"
            if [ "$goos" = "windows" ]; then
              (cd "$name/.." && zip -qr "dist/${name}.zip" "$name")
            else
              tar -czf "dist/${name}.tar.gz" "$name"
            fi
            rm -rf "$name"
          done
          (
            cd dist
            sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
          )

      - name: Verify archives and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          (cd dist && sha256sum -c SHA256SUMS.txt)
          tmp="$(mktemp -d)"
          tar -xzf "dist/zeokeel_${VERSION}_linux_amd64.tar.gz" -C "$tmp"
          "$tmp/zeokeel_${VERSION}_linux_amd64/zeokeel" --version | tee /tmp/version.txt
          grep -q "v${VERSION}" /tmp/version.txt
          unzip -l "dist/zeokeel_${VERSION}_windows_amd64.zip" | grep -q 'zeokeel.exe'

      - name: Compose release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## 这个版本更新了什么"
            echo ""
            # 只截取 CHANGELOG 中当前版本的段落，不要把历史版本都贴到发布页。
            awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 { inside = 1; next }
              inside && index($0, "## [") == 1 { exit }
              inside && !started && $0 == "" { next }
              inside { started = 1; print }
            ' CHANGELOG.md
            echo ""
            echo "## 下载"
            echo ""
            echo "选择适合你电脑系统的安装包："
            echo ""
            echo "| 系统 | 架构 | 文件 |"
            echo "| --- | --- | --- |"
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
              goos="${target%/*}"
              goarch="${target#*/}"
              case "$goos" in
                linux)  platform="Linux" ;;
                darwin) platform="macOS" ;;
                windows) platform="Windows" ;;
              esac
              case "$goarch" in
                amd64) arch="x86-64 (amd64)" ;;
                arm64) arch="ARM64" ;;
              esac
              if [ "$goos" = "windows" ]; then
                archive="zeokeel_${VERSION}_${goos}_${goarch}.zip"
              else
                archive="zeokeel_${VERSION}_${goos}_${goarch}.tar.gz"
              fi
              echo "| ${platform} | ${arch} | \`${archive}\` |"
            done
            echo ""
            echo "**校验**：\`SHA256SUMS.txt\` 是每个压缩包的 sha256。"
            echo ""
            echo '```sh'
            echo "# Linux / macOS"
            echo "tar -xzf zeokeel_${VERSION}_<系统>_<架构>.tar.gz"
            echo "./zeokeel_${VERSION}_<系统>_<架构>/zeokeel --version"
            echo ""
            echo "# Windows (PowerShell)"
            echo "Expand-Archive zeokeel_${VERSION}_windows_<架构>.zip ."
            echo ".\\zeokeel_${VERSION}_windows_<架构>\\zeokeel.exe --version"
            echo '```'
          } > release-notes.md

      - name: Remove legacy asset names
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release delete-asset "v${VERSION}" checksums.txt --yes || true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ZeoKeel v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
