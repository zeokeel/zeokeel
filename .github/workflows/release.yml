name: Release

# Every vX.Y.Z tag publishes one GitHub release, built by mygo on the runner
# of each platform: Windows installers (NSIS, GUI subsystem), Linux AppImages
# and a Linux cross-built macOS arm64 .app that a Linux packaging job signs and
# packs into a dmg with libdmg-hfsplus + rcodesign (no macOS runner at all).
# The release is created as a draft, every platform uploads into it, the central checksums step writes
# SHA256SUMS.txt and the last step publishes it. In-app updates read this
# release directly (no update-signing key): the update module picks the
# platform installer (Windows setup exe / macOS dmg / Linux AppImage) the
# release carries, and the host runs it in-app.
#
# Required repository secrets (set once by the maintainer):
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD  Developer ID Application .p12 + password
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER
#                                        App Store Connect API key for notarytool
# No secret value is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  # Domestic module mirror (also used by the Go checksum DB).
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: sum.golang.org

jobs:
  version-check:
    name: Check the tag matches VERSION
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          set -eu
          test -n "${GITHUB_REF_NAME:-}"
          version="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          }

  draft-release:
    name: Create the draft release
    needs: version-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "ZeoKeel $GITHUB_REF_NAME" --generate-notes
          fi

  build-macos:
    name: macOS arm64 (.app cross-built on Linux)
    needs: draft-release
    # No macOS compiler: the product has no cgo, so mygo cross-compiles the
    # darwin/arm64 .app on Linux. The packaging job (macOS, run only when
    # signing/dmg is possible) downloads the tar artifact and signs/creates the
    # dmg without compiling Go.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install librsvg (icon derivation)
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Build the macOS app bundle
        run: |
          set -eu
          bash scripts/build-app.sh -platform darwin/arm64 -skip-dmg -skip-notarize
          app="build/darwin-arm64/ZeoKeel.app"
          test -d "$app"
          test -f "$app/Contents/MacOS/ZeoKeel"
          file "$app/Contents/MacOS/ZeoKeel"
          tar -czf "build/zeokeel-$(cat VERSION)-darwin-arm64.tar.gz"             -C build/darwin-arm64 ZeoKeel.app
          ls -lh "build/zeokeel-$(cat VERSION)-darwin-arm64.tar.gz"

      - name: Upload the macOS app archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/zeokeel-*-darwin-arm64.tar.gz
          if-no-files-found: error

      - name: Publish the macOS app archive fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            build/zeokeel-*-darwin-arm64.tar.gz

  package-macos:
    name: macOS arm64 (Linux dmg + rcodesign)
    needs: build-macos
    # No macOS runner and no Xcode: libdmg-hfsplus creates the UDIF image and
    # rcodesign (apple-codesign) signs the app/dmg and notarizes with Apple's
    # API from Linux. This is the same tool combination Mozilla uses for
    # Firefox's Linux-built dmg and notarization.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Optional: if the toolchain or Apple credentials fail, Windows/Linux and
    # the unsigned tar.gz still publish; the updater falls back to the archive.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install the DMG toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y hfsprogs cmake g++ make curl
          command -v mkfs.hfsplus
          mkfs.hfsplus -N 2>&1 | head -3 || true

      - name: Build libdmg-hfsplus (dmg + hfsplus)
        run: |
          set -eu
          tools="$RUNNER_TEMP/dmg-tools"
          mkdir -p "$tools/src"
          curl -fsSL -o "$tools/libdmg.tar.gz" \
            https://codeload.github.com/planetbeing/libdmg-hfsplus/tar.gz/7ac55ec64c96f7800d9818ce64c79670e7f02b67
          tar -xzf "$tools/libdmg.tar.gz" -C "$tools/src" --strip-components=1
          # FileVault's crypto code targets the OpenSSL 1.x HMAC/AES API and
          # does not compile with the OpenSSL 3 headers of the runner; a plain
          # dmg never needs FileVault, so disable that target's crypto.
          sed -i 's/IF(OPENSSL_FOUND)/IF(FALSE)/' "$tools/src/dmg/CMakeLists.txt"
          cmake -S "$tools/src" -B "$tools/build" \
            -DCMAKE_BUILD_TYPE=Release -DOPENSSL_FOUND=OFF
          cmake --build "$tools/build" -j "$(nproc)"
          test -x "$tools/build/hfs/hfsplus"
          test -x "$tools/build/dmg/dmg"
          echo "HFSPLUS_TOOL=$tools/build/hfs/hfsplus" >> "$GITHUB_ENV"
          echo "DMG_TOOL=$tools/build/dmg/dmg" >> "$GITHUB_ENV"

      - name: Install rcodesign (apple-codesign)
        run: |
          set -eu
          tools="$RUNNER_TEMP/rcodesign"
          mkdir -p "$tools"
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$tools/rcodesign.tar.gz" "$url"
          curl -fsSL -o "$tools/rcodesign.tar.gz.sha256" "$url.sha256"
          expected=$(awk '{print $1}' "$tools/rcodesign.tar.gz.sha256")
          actual=$(sha256sum "$tools/rcodesign.tar.gz" | awk '{print $1}')
          test "$expected" = "$actual"
          tar -xzf "$tools/rcodesign.tar.gz" -C "$tools" --strip-components=1
          test -x "$tools/rcodesign"
          echo "RCODESIGN=$tools/rcodesign" >> "$GITHUB_ENV"

      - name: Download the Linux-built app bundle
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist

      - name: Unpack the app bundle
        run: |
          set -eu
          tar -xzf dist/zeokeel-*-darwin-arm64.tar.gz -C dist
          test -d dist/ZeoKeel.app
          test -f dist/ZeoKeel.app/Contents/MacOS/ZeoKeel
          chmod +x dist/ZeoKeel.app/Contents/MacOS/ZeoKeel

      - name: Decode the signing and notary credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -eu
          if [ -n "${MACOS_CERT_P12:-}" ]; then
            printf '%s' "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/zeokeel.p12"
            echo "MACOS_P12_FILE=$RUNNER_TEMP/zeokeel.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::MACOS_CERT_P12 is not configured; the dmg will be unsigned"
          fi
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_P8_FILE=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_API_KEY_P8 is not configured; notarization is skipped"
          fi

      - name: Create, sign and notarize the dmg
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          dmg="build/zeokeel-$(cat VERSION)-arm64.dmg"
          bash scripts/package-macos-dmg.sh dist/ZeoKeel.app "$dmg"
          ls -lh "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Upload the macOS dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            build/zeokeel-*-arm64.dmg

  build-windows:
    name: Windows installers (NSIS, GUI subsystem)
    needs: draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS and librsvg
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis librsvg2-bin

      - name: Build the installers
        run: |
          set -eu
          bash scripts/build-app.sh -platform windows/amd64,windows/arm64
          version="$(cat VERSION)"
          for arch in amd64 arm64; do
            test -f "build/windows-$arch/zeokeel-setup-$version-$arch.exe"
          done
          ls -l build/windows-amd64/zeokeel-setup-*.exe build/windows-arm64/zeokeel-setup-*.exe

      - name: Upload the Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The in-app updater runs these setup installers; no portable tar.gz
          # archive can reliably replace a per-user installed Windows app.
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            build/windows-amd64/zeokeel-setup-*.exe \
            build/windows-arm64/zeokeel-setup-*.exe

  build-linux:
    name: Linux AppImages
    needs: draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the AppImage toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin squashfs-tools patchelf desktop-file-utils file
          bin="$RUNNER_TEMP/appimage-bin"
          mkdir -p "$bin"
          for attempt in 1 2 3; do
            if GOBIN="$bin" GOPROXY=https://proxy.golang.org,direct GOSUMDB=sum.golang.org \
              go install github.com/probonopd/go-appimage/src/appimagetool@v0.0.0-20260903171257-b7864b5e53d4; then
              break
            fi
            echo "appimagetool install attempt $attempt failed; retrying" >&2
            sleep 10
          done
          printf '#!/bin/sh\nexit 0\n' > "$bin/uploadtool"
          chmod +x "$bin/uploadtool"
          for arch in x86_64 aarch64; do
            curl -fsSL --retry 5 --retry-delay 3 -o "$bin/runtime-$arch" \
              "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$arch"
            chmod +x "$bin/runtime-$arch"
          done
          echo "APPIMAGE_BIN=$bin" >> "$GITHUB_ENV"

      - name: Build the AppImages
        run: |
          set -eu
          bash scripts/build-app.sh -platform linux/amd64,linux/arm64
          APPIMAGETOOL="$APPIMAGE_BIN/appimagetool" \
            APPIMAGE_RUNTIME="$APPIMAGE_BIN/runtime-x86_64" \
            bash scripts/build-appimage.sh build/linux-amd64 "$(cat VERSION)" amd64
          APPIMAGETOOL="$APPIMAGE_BIN/appimagetool" \
            APPIMAGE_RUNTIME="$APPIMAGE_BIN/runtime-aarch64" \
            bash scripts/build-appimage.sh build/linux-arm64 "$(cat VERSION)" arm64
          ls -l build/zeokeel-*-linux-*.AppImage

      - name: Upload the Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            build/zeokeel-*-linux-amd64.AppImage \
            build/zeokeel-*-linux-arm64.AppImage

  publish:
    name: Checksums and publish
    needs: [package-macos, build-windows, build-linux]
    # package-macos (Linux dmg/sign/notarize) is optional; never block the release on it.
    if: always() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the published assets, checksum them, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets --clobber --pattern '*'
          rm -f release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
