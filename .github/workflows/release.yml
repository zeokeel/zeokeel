name: Release

# Every vX.Y.Z tag publishes one GitHub release containing the server binary for
# each supported platform. The product has no desktop shell any more: the binary
# is the whole application (serve / headless / acp), and the browser client is
# embedded, so a tarball with one executable per platform is the complete
# artifact set. The release is created as a draft, each platform job uploads into
# it, the checksums step writes SHA256SUMS.txt, and the last step publishes.
#
# No signing keys, no notarization, no installers: there is nothing to sign when
# the artifact is a CLI binary and the UI is a browser tab.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  version-check:
    name: Check the tag matches VERSION
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          set -eu
          test -n "${GITHUB_REF_NAME:-}"
          version="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          }

  draft-release:
    name: Create the draft release
    needs: version-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "ZeoKeel $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The web client bundle is gitignored, so a fresh checkout embeds only
      # `.keep`. Build it before the binary: the release must actually carry the
      # browser client.
      - uses: ./.github/actions/web-client

      - name: Build the binary
        run: |
          set -eu
          version="$(cat VERSION)"
          binary="zeokeel"
          if [ "${{ matrix.goos }}" = "windows" ]; then binary="zeokeel.exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= \
              -X github.com/zeokeel/zeokeel/internal/host.Version=v${version} \
              -X github.com/zeokeel/zeokeel/internal/host.Commit=$(git rev-parse --short=12 HEAD) \
              -X github.com/zeokeel/zeokeel/internal/host.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${binary}" ./cmd/zeokeel
          ./scripts/release-archive.sh

      - name: Upload the asset
        env:
          GH_TOKEN: ${{ github.token }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          asset="$(ls dist/zeokeel-*-${GOOS}-${GOARCH}.*)"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$asset"

  publish:
    name: Checksums and publish
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the published assets, checksum them, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets --clobber --pattern '*'
          rm -f release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
