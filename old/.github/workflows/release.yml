name: release

# Release pipeline: one tag (vX.Y.Z) → platform packages + SHA256SUMS + GitHub
# Release. The actual packaging logic lives in scripts/build.sh so a local
# `make release` produces the same artifacts on the same inputs.
#
# NOT signed: Windows Authenticode / macOS notarization need certificates and
# CI secrets (docs/BUGS.md AR-03). Until then releases are explicitly
# "unsigned build" and the README says so.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: package-linux
          - os: macos-latest
            target: package-macos
          - os: windows-latest
            target: package-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: version metadata (from tag)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then version="0.0.0-${GITHUB_SHA::7}"; fi
          echo "ZEOKEEL_VERSION=$version" >> "$GITHUB_ENV"
          echo "ZEOKEEL_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: package
        shell: bash
        run: sh scripts/build.sh ${{ matrix.target }}
      - name: checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum zeokeel-*.tar.gz zeokeel-*.zip zeokeel-*.exe 2>/dev/null > SHA256SUMS.txt || true
          else
            shasum -a 256 zeokeel-*.tar.gz zeokeel-*.zip zeokeel-*.exe 2>/dev/null > SHA256SUMS.txt || true
          fi
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true
      - name: aggregate checksums
        run: |
          cd artifacts
          sha256sum zeokeel-*.tar.gz zeokeel-*.zip zeokeel-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: ZeoKeel ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/zeokeel-*.tar.gz
            artifacts/zeokeel-*.zip
            artifacts/zeokeel-*.exe
            artifacts/SHA256SUMS.txt
          body: |
            ZeoKeel ${{ github.ref_name }} — **unsigned build**.

            Artifacts are produced by `scripts/build.sh` (same command as `make release`)
            with version metadata from this tag. Verify `SHA256SUMS.txt` before running.

            - Windows: portable zip (`zeokeel-windows-amd64.exe` GUI +
              `zeokeel-windows-amd64-console.exe`). The installer (Inno/NSIS) is
              planned but not built yet: see `packaging/windows/INSTALLER-PLAN.md`.
            - Linux: `zeokeel-linux-{amd64,arm64}.tar.gz`.
            - macOS: `zeokeel-macos-{arm64,amd64}.zip` (unsigned `.app`; Gatekeeper
              needs `xattr -dr com.apple.quarantine` on first launch).

            Signing/notarization is deferred (needs certificates + CI secrets, AR-03).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
